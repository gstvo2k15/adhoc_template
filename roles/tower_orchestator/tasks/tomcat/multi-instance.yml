---
- name: Starting block for search every possible instance
  block:
    - name: Locate every tomcat instance directory
      find:
        paths: "{{ base_dir }}"
        patterns: "{{ pattern }}"
        file_type: directory
      register: tomcat_find

    - name: Set_fact instance_names and instances_count
      set_fact:
        instance_names: "{{ tomcat_find.files | map(attribute='path') | map('basename') | list }}"
        instances_count: "{{ tomcat_find.files | length }}"
        primary_instance: "{{ (tomcat_find.files | length > 0) | ternary((tomcat_find.files[0].path | basename), 'N/A') }}"

    - name: Initialise dictionaries
      set_fact:
        cat_home_by_inst: {}
        java_home_by_inst: {}
        cat_real_by_inst: {}
        java_real_by_inst: {}
        tomcat_rpm_by_inst: {}
        java_rpm_by_inst: {}
        tomcat_rpmi_by_inst: {}
        jdk_rpmi_by_inst: {}
        instances: []
        elastic_instances: []
      ignore_errors: true

    - name: Read CATALINA_HOME from setenv.sh in instance(s) detected
      command: grep -oP '^export\s+CATALINA_HOME=\K[^[:space:]]+' {{ item.path }}/scripts/setenv.sh
      loop: "{{ tomcat_find.files }}"
      loop_control:
        label: "{{ item.path }}"
      register: cat_raw
      ignore_errors: true

    - name: Store CATALINA_HOME in dict
      set_fact:
        cat_home_by_inst: >-
          {{ cat_home_by_inst
             | combine({ (item.item.path | basename): (item.stdout | default('') | trim) }) }}
      loop: "{{ cat_raw.results | default([]) }}"
      loop_control:
        label: "{{ item.item.path }}"
      ignore_errors: true

- name: Read JAVA_HOME from setenv.sh in instance(s) detected
  command: >
    grep -oP '^export\s+JAVA_HOME=\K[^[:space:]]+' {{ item.path }}/scripts/setenv.sh
  loop: "{{ tomcat_find.files }}"
  loop_control:
    label: "{{ item.path }}"
  register: java_raw
  changed_when: false
  ignore_errors: true

- name: Store JAVA_HOME in dict
  set_fact:
    java_home_by_inst: >-
      {{ java_home_by_inst
         | combine({ (item.item.path | basename): (item.stdout | default('') | trim) }) }}
  loop: "{{ java_raw.results | default([]) }}"
  loop_control:
    label: "{{ item.item.path }}"
  ignore_errors: true

- name: Derive missing CATALINA_HOME from version.sh
  shell: |
    source "{{ item.path }}/scripts/version.sh"
    echo "$TOMCAT_VERSION"
  loop: "{{ tomcat_find.files }}"
  loop_control:
    label: "{{ item.path }}"
  register: tomcat_ver_raw
  changed_when: false
  when: cat_raw is not defined
  ignore_errors: true

- name: Derive missing JAVA_HOME from version.sh
  shell: |
    source "{{ item.path }}/scripts/version.sh"
    echo "$JAVA_VERSION"
  loop: "{{ tomcat_find.files }}"
  loop_control:
    label: "{{ item.path }}"
  register: java_ver_raw
  changed_when: false
  when: java_raw is not defined
  ignore_errors: true


- name: Merge derived CATALINA_HOME into dict
  set_fact:
    cat_home_by_inst: >-
      {{
        cat_home_by_inst | combine({
          (item.item.path | basename):
          (cat_home_by_inst[item.item.path | basename] | default('') | trim)
          or ('/apps/install/asf-tomcat' ~
              (tomcat_ver_raw.results
               | selectattr('item.path', 'equalto', item.item.path)
               | map(attribute='stdout')
               | list
               | first
               | default('')) ~ '/current')
        })
      }}
  loop: "{{ cat_raw.results | default([]) }}"
  loop_control:
    label: "{{ item.item.path }}"
  when: cat_raw is not defined
  ignore_errors: true

- name: Merge derived JAVA_HOME into dict
  set_fact:
    java_home_by_inst: >-
      {{
        java_home_by_inst | combine({
          (item.item.path | basename):
          (java_home_by_inst[item.item.path | basename] | default('') | trim)
          or ('/apps/install/java/jdk' ~
              (java_ver_raw.results
               | selectattr('item.path', 'equalto', item.item.path)
               | map(attribute='stdout')
               | list
               | first
               | default('')) ~ '_current')
        })
      }}
  loop: "{{ java_raw.results | default([]) }}"
  loop_control:
    label: "{{ item.item.path }}"
  when: java_raw is not defined
  ignore_errors: true


- name: Resolve real path of each CATALINA_HOME
  command: readlink "{{ cat_home_by_inst[item.key] }}"
  loop: "{{ cat_home_by_inst | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: cat_home_by_inst[item.key] | default('') | trim != ''
  register: cat_real_raw
  changed_when: false
  ignore_errors: true

- name: Store resolved CATALINA_HOME path
  set_fact:
    cat_real_by_inst: >-
      {{ cat_real_by_inst
         | combine({ (item.item.key): (item.stdout | default('') | trim) }) }}
  loop: "{{ cat_real_raw.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"
  ignore_errors: true

- name: Resolve real path of each JAVA_HOME
  command: readlink "{{ java_home_by_inst[item.key] }}"
  loop: "{{ java_home_by_inst | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: java_home_by_inst[item.key] | default('') | trim != ''
  register: java_real_raw
  changed_when: false
  ignore_errors: true

- name: Store resolved JAVA_HOME path
  set_fact:
    java_real_by_inst: >-
      {{ java_real_by_inst
         | combine({ (item.item.key): (item.stdout | default('') | trim) }) }}
  loop: "{{ java_real_raw.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"
  ignore_errors: true


- name: SHA1 policy workaround (if needed)
  block:
    - name: Detect SHA-1 signature problem (mdw packages)
      shell: rpm -qa | grep mdw
      register: _sha1_check
      changed_when: false
      failed_when: false

    - name: Set flag indicating whether SHA-1 policy is required
      set_fact:
        _sha1_needed: "{{ ('Signature not supported' in (_sha1_check.stderr | default(''))) | bool }}"

    - name: Enable SHA-1 policy (temporary workaround)
      command: update-crypto-policies --set DEFAULT:SHA1
      when: _sha1_needed | default(false)
      changed_when: false
  ignore_errors: true

- name: Rpm that owns each resolved Tomcat directory (ASF)
  command: "rpm -qf mdw-asf-tomcat{{ cat_real_by_inst[item.key] }}"
  loop: "{{ cat_real_by_inst | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - cat_real_by_inst[item.key] | default('') | trim != ''
    - productname == "Apache Tomcat"
  register: tomcat_rpm_raw
  changed_when: false
  ignore_errors: true

- name: Rpm that owns each resolved Tomcat directory (JWS)
  command: "rpm -qf mdw-jws-tomcat{{ cat_real_by_inst[item.key] }}"
  loop: "{{ cat_real_by_inst | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - cat_real_by_inst[item.key] | default('') | trim != ''
    - productname == "JBoss Enterprise Web Server"
  register: tomcat_rpm_raw
  changed_when: false
  ignore_errors: true

- name: Store Tomcat rpm in dict
  set_fact:
    tomcat_rpm_by_inst: >-
      {{ tomcat_rpm_by_inst
         | combine({ (item.item.key): (item.stdout | default('Not_found') | trim) }) }}
  loop: "{{ tomcat_rpm_raw.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"
  ignore_errors: true

- name: Rpm that owns each resolved Java directory
  command: "rpm -qf mdw-jdk{{ java_real_by_inst[item.key] }}"
  loop: "{{ java_real_by_inst | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: java_real_by_inst[item.key] | default('') | trim != ''
  register: java_rpm_raw
  changed_when: false
  ignore_errors: true

- name: Restore default crypto policy
  command: update-crypto-policies --set DEFAULT
  when: _sha1_needed | default(false)
  changed_when: false
  ignore_errors: true

- name: Store Java rpm in dict
  set_fact:
    java_rpm_by_inst: >-
      {{ java_rpm_by_inst
         | combine({ (item.item.key): (item.stdout | default('Not_found') | trim) }) }}
  loop: "{{ java_rpm_raw.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"
  ignore_errors: true



- name: Build instances list with rpm owner info
  set_fact:
    instances: >-
      {{ instances + [ {
        'name': item,
        'tomcat_rpm': (tomcat_rpm_by_inst[item] | default('Not_found')),
        'jdk_rpm': (java_rpm_by_inst[item] | default('Not_found'))
      } ] }}
  loop: "{{ instance_names | default([]) }}"
  loop_control:
    label: "{{ item }}"
  ignore_errors: true

- name: rpm -qi for Tomcat package per instance
  command: rpm -qi "{{ item.tomcat_rpm }}"
  loop: "{{ instances | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - (item.tomcat_rpm | default('') | trim) not in ['', 'Not_found']
    - (item.tomcat_rpm | default('') | trim) is not search('is not owned')
  register: _tomcat_qi
  changed_when: false
  ignore_errors: true

- name: Store rpm -qi Tomcat output per instance
  set_fact:
    tomcat_rpmi_by_inst: >-
      {{ tomcat_rpmi_by_inst
         | combine({ (item.item.name): (item.stdout | default('Not_found')) }) }}
  loop: "{{ _tomcat_qi.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  ignore_errors: true

- name: rpm -qi for JDK package per instance
  command: rpm -qi "{{ item.jdk_rpm }}"
  loop: "{{ instances | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - (item.jdk_rpm | default('') | trim) not in ['', 'Not_found']
    - (item.jdk_rpm | default('') | trim) is not search('is not owned')
  register: _jdk_qi
  changed_when: false
  ignore_errors: true



- name: Store rpm -qi JDK output per instance
  set_fact:
    jdk_rpmi_by_inst: >-
      {{ jdk_rpmi_by_inst
         | combine({ (item.item.name): (item.stdout | default('Not_found')) }) }}
  loop: "{{ _jdk_qi.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  ignore_errors: true

- name: Build elastic_instances (one entry per detected instance)
  set_fact:
    elastic_instances: >-
      {{ elastic_instances + [ {
        'name': item.name,
        'tomcat_rpm': (item.tomcat_rpm | default('Not_found')),
        'jdk_rpm': (item.jdk_rpm | default('Not_found')),
        'tomcat_rpmi': (tomcat_rpmi_by_inst[item.name] | default('Not_found')),
        'jdk_rpmi': (jdk_rpmi_by_inst[item.name] | default('Not_found'))
      } ] }}
  loop: "{{ instances | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  ignore_errors: true

- name: jdk_instances_count (unique JDK packages across instances)
  set_fact:
    jdk_instances_count: >-
      {{ (instances | map(attribute='jdk_rpm') | select('string') | list | unique | length) }}
  ignore_errors: true

- name: Compute product_version per instance
  set_fact:
    product_version_by_inst: >-
      {{ product_version_by_inst | default({}) |
         combine({ item.name :
           ((item.tomcat_rpm.split('-')[2] | regex_replace('^tomcat', ''))
             if (item.tomcat_rpm is defined and
                 item.tomcat_rpm != 'Not_found' and
                 (item.tomcat_rpm.split('-') | length > 2))
             else 'Not_found')
         }) }}
  loop: "{{ instances | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  ignore_errors: true


- name: Compute product_patch_version per instance
  set_fact:
    product_patch_version_by_inst: >-
      {{ product_patch_version_by_inst | default({}) |
         combine({
           item.name :
             (item.tomcat_rpm.split('-')[-2])
             if (item.tomcat_rpm is defined and item.tomcat_rpm != 'Not_found')
             else 'Not_found'
         })
      }}
  loop: "{{ instances | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  ignore_errors: true

- name: Compute java_version per instance
  set_fact:
    java_version_by_inst: >-
      {{ java_version_by_inst | default({}) |
         combine({
           item.name :
             (item.jdk_rpm.split('-')[2])
             if (item.jdk_rpm is defined
                 and item.jdk_rpm != 'Not_found'
                 and (item.jdk_rpm.split('-') | length) > 3)
             else 'Not_found'
         })
      }}
  loop: "{{ instances | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  ignore_errors: true

- name: Debug versions dictionaries (optional)
  debug:
    msg:
      product_version_by_inst: "{{ product_version_by_inst }}"
      product_patch_version_by_inst: "{{ product_patch_version_by_inst }}"
      java_version_by_inst: "{{ java_version_by_inst }}"
  ignore_errors: true