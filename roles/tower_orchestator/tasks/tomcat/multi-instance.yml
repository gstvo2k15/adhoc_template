---
- name: Starting block for search every possible instance
  block:
    - name: Locate every tomcat instance directory
      find:
        paths: "{{ base_dir }}"
        patterns: "{{ pattern }}"
        file_type: directory
      register: tomcat_find

    - name: Set_fact instance_names and instances_count
      set_fact:
        instance_names: "{{ tomcat_find.files | map(attribute='path') | map('basename') | list }}"
        instances_count: "{{ tomcat_find.files | length }}"
        primary_instance: "{{ (tomcat_find.files | length > 0) | ternary((tomcat_find.files[0].path | basename), 'N/A') }}"

    - name: Initialise dictionaries
      set_fact:
        cat_home_by_inst: {}
        java_home_by_inst: {}
        cat_real_by_inst: {}
        java_real_by_inst: {}
        tomcat_rpm_by_inst: {}
        java_rpm_by_inst: {}
        tomcat_rpmi_by_inst: {}
        jdk_rpmi_by_inst: {}
        instances: []
        elastic_instances: []
  ignore_errors: true


- name: Read raw CATALINA_HOME from setenv.sh (if present)
  shell: |
    set -euo pipefail
    f="{{ item.path }}/scripts/setenv.sh"
    if [[ -f "$f" ]]; then
      grep -oP '^export\s+CATALINA_HOME=\K[^[:space:]]+' "$f" || true
    fi
  args:
    executable: /bin/bash
  loop: "{{ tomcat_find.files }}"
  loop_control:
    label: "{{ item.path }}"
  register: cat_raw
  changed_when: false
  failed_when: false

- name: Store CATALINA_HOME in dict (raw)
  set_fact:
    cat_home_by_inst: >-
      {{ cat_home_by_inst
         | combine({ (item.item.path | basename): (item.stdout | default('') | trim) }) }}
  loop: "{{ cat_raw.results | default([]) }}"
  loop_control:
    label: "{{ item.item.path }}"
  ignore_errors: true

- name: Read raw JAVA_HOME from setenv.sh (if present)
  shell: |
    set -euo pipefail
    f="{{ item.path }}/scripts/setenv.sh"
    if [[ -f "$f" ]]; then
      grep -oP '^export\s+JAVA_HOME=\K[^[:space:]]+' "$f" || true
    fi
  args:
    executable: /bin/bash
  loop: "{{ tomcat_find.files }}"
  loop_control:
    label: "{{ item.path }}"
  register: java_raw
  changed_when: false
  failed_when: false

- name: Store JAVA_HOME in dict (raw)
  set_fact:
    java_home_by_inst: >-
      {{ java_home_by_inst
         | combine({ (item.item.path | basename): (item.stdout | default('') | trim) }) }}
  loop: "{{ java_raw.results | default([]) }}"
  loop_control:
    label: "{{ item.item.path }}"
  ignore_errors: true

# -----------------------------
# Normalize quotes: "...." -> ....
# -----------------------------
- name: Strip outer quotes from CATALINA_HOME
  set_fact:
    cat_home_by_inst: >-
      {{
        cat_home_by_inst | default({}) | combine({
          item.key: (item.value | default('') | trim | regex_replace('^\"(.*)\"$', '\\1'))
        })
      }}
  loop: "{{ cat_home_by_inst | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  changed_when: false
- name: Strip outer quotes from JAVA_HOME
  set_fact:
    java_home_by_inst: >-
      {{
        java_home_by_inst | default({}) | combine({
          item.key: (item.value | default('') | trim | regex_replace('^\"(.*)\"$', '\\1'))
        })
      }}
  loop: "{{ java_home_by_inst | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  changed_when: false

# -----------------------------
# Expand ${TOMCAT_VERSION}/${JAVA_VERSION} only if present
# (source version.sh then eval echo)
# -----------------------------
- name: Expand CATALINA_HOME if it contains ${...}
  shell: |
    set -euo pipefail
    inst="{{ item.path | basename }}"
    val={{ (cat_home_by_inst[inst] | default('') | trim) | quote }}
    if [[ -z "$val" ]]; then
      exit 0
    fi
    if [[ "$val" == *'${'* ]]; then
      source "{{ item.path }}/scripts/version.sh"
      eval "echo $val"
    else
      echo "$val"
    fi
  args:
    executable: /bin/bash
  loop: "{{ tomcat_find.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  register: cat_expanded_raw
  changed_when: false
  failed_when: false

- name: Store expanded CATALINA_HOME
  set_fact:
    cat_home_by_inst: >-
      {{
        cat_home_by_inst | default({}) | combine({
          (item.item.path | basename): (item.stdout | default('') | trim)
        })
      }}
  loop: "{{ cat_expanded_raw.results | default([]) }}"
  loop_control:
    label: "{{ item.item.path }}"
  changed_when: false

- name: Expand JAVA_HOME if it contains ${...}
  shell: |
    set -euo pipefail
    inst="{{ item.path | basename }}"
    val={{ (java_home_by_inst[inst] | default('') | trim) | quote }}
    if [[ -z "$val" ]]; then
      exit 0
    fi
    if [[ "$val" == *'${'* ]]; then
      source "{{ item.path }}/scripts/version.sh"
      eval "echo $val"
    else
      echo "$val"
    fi
  args:
    executable: /bin/bash
  loop: "{{ tomcat_find.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  register: java_expanded_raw
  changed_when: false
  failed_when: false

- name: Store expanded JAVA_HOME
  set_fact:
    java_home_by_inst: >-
      {{
        java_home_by_inst | default({}) | combine({
          (item.item.path | basename): (item.stdout | default('') | trim)
        })
      }}
  loop: "{{ java_expanded_raw.results | default([]) }}"
  loop_control:
    label: "{{ item.item.path }}"
  changed_when: false

# -----------------------------
# Resolve real paths (symlinks)
# -----------------------------
- name: Resolve real path of each CATALINA_HOME (readlink -f)
  command: readlink -f "{{ cat_home_by_inst[item.key] }}"
  loop: "{{ cat_home_by_inst | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: cat_home_by_inst[item.key] | default('') | trim != ''
  register: cat_real_raw
  changed_when: false
  failed_when: false

- name: Store resolved CATALINA_HOME path
  set_fact:
    cat_real_by_inst: >-
      {{ cat_real_by_inst
         | combine({ (item.item.key): (item.stdout | default('') | trim) }) }}
  loop: "{{ cat_real_raw.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"
  ignore_errors: true

- name: Resolve real path of each JAVA_HOME (readlink -f)
  command: readlink -f "{{ java_home_by_inst[item.key] }}"
  loop: "{{ java_home_by_inst | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: java_home_by_inst[item.key] | default('') | trim != ''
  register: java_real_raw
  changed_when: false
  failed_when: false

- name: Store resolved JAVA_HOME path
  set_fact:
    java_real_by_inst: >-
      {{ java_real_by_inst
         | combine({ (item.item.key): (item.stdout | default('') | trim) }) }}
  loop: "{{ java_real_raw.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"
  ignore_errors: true

# -----------------------------
# SHA1 policy workaround (kept)
# -----------------------------
- name: SHA1 policy workaround (if needed)
  block:
    - name: Detect SHA-1 signature problem (mdw packages)
      shell: rpm -qa | grep -i mdw || true
      register: _sha1_check
      changed_when: false
      failed_when: false
    - name: Set flag indicating whether SHA-1 policy is required
      set_fact:
        _sha1_needed: "{{ ('Signature not supported' in (_sha1_check.stderr | default(''))) | bool }}"
    - name: Enable SHA-1 policy (temporary workaround)
      command: update-crypto-policies --set DEFAULT:SHA1
      when: _sha1_needed | default(false)
      changed_when: false
  ignore_errors: true

# -----------------------------
# rpm owner of the resolved directories
# rpm -qf necesita RUTA, no nombre de paquete
# -----------------------------
- name: Rpm that owns each resolved Tomcat directory
  command: rpm -qf "{{ cat_real_by_inst[item.key] }}"
  loop: "{{ cat_real_by_inst | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - cat_real_by_inst[item.key] | default('') | trim != ''
  register: tomcat_rpm_raw
  changed_when: false
  failed_when: false
  ignore_errors: true

- name: Store Tomcat rpm in dict
  set_fact:
    tomcat_rpm_by_inst: >-
      {{ tomcat_rpm_by_inst
         | combine({ (item.item.key): (item.stdout | default('Not_found') | trim) }) }}
  loop: "{{ tomcat_rpm_raw.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"
  ignore_errors: true

- name: Rpm that owns each resolved Java directory
  command: rpm -qf "{{ java_real_by_inst[item.key] }}"
  loop: "{{ java_real_by_inst | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: java_real_by_inst[item.key] | default('') | trim != ''
  register: java_rpm_raw
  changed_when: false
  failed_when: false
  ignore_errors: true

- name: Store Java rpm in dict
  set_fact:
    java_rpm_by_inst: >-
      {{ java_rpm_by_inst
         | combine({ (item.item.key): (item.stdout | default('Not_found') | trim) }) }}
  loop: "{{ java_rpm_raw.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"
  ignore_errors: true
- name: Restore default crypto policy
  command: update-crypto-policies --set DEFAULT
  when: _sha1_needed | default(false)
  changed_when: false
  ignore_errors: true

# -----------------------------
# Build instances list
# -----------------------------
- name: Build instances list with rpm owner info
  set_fact:
    instances: >-
      {{ instances + [ {
        'name': item,
        'tomcat_rpm': (tomcat_rpm_by_inst[item] | default('Not_found')),
        'jdk_rpm': (java_rpm_by_inst[item] | default('Not_found'))
      } ] }}
  loop: "{{ instance_names | default([]) }}"
  loop_control:
    label: "{{ item }}"
  ignore_errors: true

# -----------------------------
# rpm -qi per package
# -----------------------------
- name: rpm -qi for Tomcat package per instance
  command: rpm -qi "{{ item.tomcat_rpm }}"
  loop: "{{ instances | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - (item.tomcat_rpm | default('') | trim) not in ['', 'Not_found']
    - (item.tomcat_rpm | default('') | trim) is not search('is not owned')
  register: _tomcat_qi
  changed_when: false
  failed_when: false
  ignore_errors: true

- name: Store rpm -qi Tomcat output per instance
  set_fact:
    tomcat_rpmi_by_inst: >-
      {{ tomcat_rpmi_by_inst
         | combine({ (item.item.name): (item.stdout | default('Not_found')) }) }}
  loop: "{{ _tomcat_qi.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  ignore_errors: true

- name: rpm -qi for JDK package per instance
  command: rpm -qi "{{ item.jdk_rpm }}"
  loop: "{{ instances | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - (item.jdk_rpm | default('') | trim) not in ['', 'Not_found']
    - (item.jdk_rpm | default('') | trim) is not search('is not owned')
  register: _jdk_qi
  changed_when: false
  failed_when: false
  ignore_errors: true

- name: Store rpm -qi JDK output per instance
  set_fact:
    jdk_rpmi_by_inst: >-
      {{ jdk_rpmi_by_inst
         | combine({ (item.item.name): (item.stdout | default('Not_found')) }) }}
  loop: "{{ _jdk_qi.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  ignore_errors: true

# -----------------------------
# Build elastic_instances payload
# -----------------------------
- name: Build elastic_instances (one entry per detected instance)
  set_fact:
    elastic_instances: >-
      {{ elastic_instances + [ {
        'name': item.name,
        'tomcat_rpm': (item.tomcat_rpm | default('Not_found')),
        'jdk_rpm': (item.jdk_rpm | default('Not_found')),
        'tomcat_rpmi': (tomcat_rpmi_by_inst[item.name] | default('Not_found')),
        'jdk_rpmi': (jdk_rpmi_by_inst[item.name] | default('Not_found'))
      } ] }}
  loop: "{{ instances | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  ignore_errors: true
- name: jdk_instances_count (unique JDK packages across instances)
  set_fact:
    jdk_instances_count: >-
      {{ (instances | map(attribute='jdk_rpm') | select('string') | list | unique | length) }}
  ignore_errors: true

# -----------------------------
# Compute versions from rpm names
# -----------------------------
- name: Compute product_version per instance
  set_fact:
    product_version_by_inst: >-
      {{ product_version_by_inst | default({}) |
         combine({ item.name :
           ((item.tomcat_rpm.split('-')[2] | regex_replace('^tomcat', ''))
             if (item.tomcat_rpm is defined and
                 item.tomcat_rpm != 'Not_found' and
                 (item.tomcat_rpm.split('-') | length > 2))
             else 'Not_found')
         }) }}
  loop: "{{ instances | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  ignore_errors: true
- name: Compute product_patch_version per instance
  set_fact:
    product_patch_version_by_inst: >-
      {{ product_patch_version_by_inst | default({}) |
         combine({
           item.name :
             (item.tomcat_rpm.split('-')[-2])
             if (item.tomcat_rpm is defined and item.tomcat_rpm != 'Not_found' and (item.tomcat_rpm.split('-') | length > 2))
             else 'Not_found'
         })
      }}
  loop: "{{ instances | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  ignore_errors: true

- name: Compute java_version per instance
  set_fact:
    java_version_by_inst: >-
      {{ java_version_by_inst | default({}) |
         combine({
           item.name :
             (item.jdk_rpm.split('-')[2])
             if (item.jdk_rpm is defined
                 and item.jdk_rpm != 'Not_found'
                 and (item.jdk_rpm.split('-') | length) > 3)
             else 'Not_found'
         })
      }}
  loop: "{{ instances | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  ignore_errors: true

- name: Debug versions dictionaries (optional)
  debug:
    msg:
      cat_home_by_inst: "{{ cat_home_by_inst }}"
      java_home_by_inst: "{{ java_home_by_inst }}"
      cat_real_by_inst: "{{ cat_real_by_inst }}"
      java_real_by_inst: "{{ java_real_by_inst }}"
      tomcat_rpm_by_inst: "{{ tomcat_rpm_by_inst }}"
      java_rpm_by_inst: "{{ java_rpm_by_inst }}"
      product_version_by_inst: "{{ product_version_by_inst }}"
      product_patch_version_by_inst: "{{ product_patch_version_by_inst }}"
      java_version_by_inst: "{{ java_version_by_inst }}"
  ignore_errors: true